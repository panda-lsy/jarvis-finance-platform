# 放入 agent.shengxia.me 的 HTTPS server {} 内。
# 只暴露 Java 主后端；Python 8100 不提供公网路由。

location ^~ /py/ {
    return 404;
}

location = /py {
    return 404;
}

# Spring Boot management/Prometheus 只允许服务器本机 127.0.0.1:8201 访问。
location ^~ /actuator/ {
    return 404;
}

location = /actuator {
    return 404;
}

# AI 对话 SSE：精确路由必须关闭 Nginx buffering，否则前端会等到大块缓存后才看到文本。
location = /api/ai/chat/stream {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    client_max_body_size 1m;

    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;
    add_header X-Accel-Buffering no always;
}

location /api/ {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;

    # AI/财报文本当前均为 JSON；限制异常大请求。
    client_max_body_size 1m;

    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
}
