name: Deploy Frontend to GitHub Pages

# 触发: 推送到 main 且 frontend/ 或工作流文件有改动
on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Vue app
        working-directory: frontend
        env:
          # Cloudflare 的 f.shengxia.me/api/* Worker Route 上线后，将仓库变量
          # VITE_API_MODE 设为 same-origin 即可无代码切换；未设置时保持现网跨子域 API。
          VITE_API_MODE: ${{ vars.VITE_API_MODE }}
        run: npm run build

      - name: Stamp deployment version
        working-directory: frontend
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          printf '{"git_sha":"%s","built_at":"%s","source":"github-pages"}\n' \
            "$BUILD_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json

      - name: Prepare Pages artifact
        # Vue 构建产物发布到 GitHub Pages 根路径；CNAME 来自 frontend/public/CNAME。
        run: |
          mkdir -p _site
          cp -r frontend/dist/* _site/
          # 附带仓库说明页
          cp README.md _site/README_PROJECT.md 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
