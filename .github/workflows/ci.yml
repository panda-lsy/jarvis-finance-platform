name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  deploy-scripts:
    name: Deploy Scripts Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment shell scripts
        run: bash -n deploy/scripts/*.sh

  java-backend:
    name: Java Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java backend
        working-directory: java-backend
        run: mvn -B -DskipTests package

      - name: Run Java tests
        working-directory: java-backend
        run: mvn -B test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Vue frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  python-ai:
    name: Python AI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python AI dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Python AI tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m compileall -q backend/app
          pytest -q backend/tests
