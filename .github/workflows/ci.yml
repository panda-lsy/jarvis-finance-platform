name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  java-backend:
    name: Java Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java backend
        working-directory: java-backend
        run: mvn -B -DskipTests package

      - name: Run Java tests
        working-directory: java-backend
        run: mvn -B test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Vue frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  python-helper:
    name: Python Helper Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Syntax check Python helper
        run: |
          python -m py_compile backend/app/*.py
          python -m compileall -q backend/app
