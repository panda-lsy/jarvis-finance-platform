name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  deploy-scripts:
    name: Deploy Scripts Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment shell scripts
        run: bash -n deploy/scripts/*.sh

  java-backend:
    name: Java Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java backend
        working-directory: java-backend
        run: mvn -B -DskipTests package

      - name: Run Java tests
        working-directory: java-backend
        run: mvn -B test

  postgres-schema:
    name: PostgreSQL Flyway & Prod Startup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jarvis_ci
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build production jar
        working-directory: java-backend
        run: mvn -B -DskipTests package

      - name: Apply Flyway migrations and validate prod schema
        working-directory: java-backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://127.0.0.1:5432/jarvis_ci
          DB_USERNAME: jarvis
          DB_PASSWORD: jarvis_ci_password
          JWT_SECRET: ci-postgres-schema-secret-at-least-32-bytes-long
          PYTHON_SERVICE_TOKEN: ci-internal-token-not-used-by-schema-test
          AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
        run: |
          set -euo pipefail
          jar="$(find target -maxdepth 1 -name 'gold-research-backend-*.jar' ! -name '*.original' | head -n 1)"
          test -n "$jar"
          java -jar "$jar" \
            --server.port=18200 \
            --management.server.port=18201 \
            --jarvis.market.live-poll-interval-ms=3600000 \
            --jarvis.jd.live-poll-interval-ms=3600000 \
            >/tmp/jarvis-postgres-ci.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:18200/api/health/ready >/dev/null; then
              echo "PostgreSQL Flyway + Hibernate validate startup passed"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/jarvis-postgres-ci.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/jarvis-postgres-ci.log
          exit 1

      - name: Verify simulated-trading locks on PostgreSQL
        working-directory: java-backend
        env:
          RUN_PG_IT: 'true'
          PG_IT_URL: jdbc:postgresql://127.0.0.1:5432/jarvis_ci
          PG_IT_USERNAME: jarvis
          PG_IT_PASSWORD: jarvis_ci_password
        run: mvn -B -Dtest=SimTradingPostgresIntegrationTest,PostgresLockPolicyIntegrationTest test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run frontend P0 tests
        working-directory: frontend
        run: npm run test:p0

      - name: Build Vue frontend
        working-directory: frontend
        run: npm run build

  python-ai:
    name: Python AI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python AI dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Python AI tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m compileall -q backend/app
          pytest -q backend/tests

  e2e:
    name: Playwright Browser Acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run credential-free browser acceptance tests
        working-directory: e2e
        env:
          CI: 'true'
          E2E_MANAGED_SERVER: '1'
        run: npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-acceptance-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
