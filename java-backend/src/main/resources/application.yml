spring:
  application:
    name: jarvis-gold-research-backend
  datasource:
    # 默认 H2 文件库; 生产可切换 SQLite(见下注释) 或 MySQL/Postgres
    url: jdbc:h2:file:./data/research;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 本地 H2 仍由 Hibernate 自动建表；生产 profile 切 PostgreSQL 后启用 Flyway。
    enabled: false

server:
  port: 8200

# 贾维斯平台配置
jarvis:
  # 黄金行情 (沿用现有腾讯源)
  gold:
    realtime-url: https://qt.gtimg.cn/q={symbol}
    kline-url: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
    default-symbol: sh518850
  # Python 辅助微服务 (数据采集/AI预处理), 可选
  python-service:
    enabled: true
    base-url: http://127.0.0.1:8100
    # Java -> Python 内部调用凭证。生产环境必须通过环境变量配置。
    internal-token: ${PYTHON_SERVICE_TOKEN:}
  cors:
    # 逗号分隔，可通过 CORS_ALLOWED_ORIGINS 覆盖。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://f.shengxia.me,http://localhost:5173,http://127.0.0.1:5173}
  auth:
    cookie-name: jarvis_token
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    same-site: Strict
  # JWT 认证
  jwt:
    # 必须通过环境变量提供；未配置时应用启动失败，避免误用仓库内默认密钥。
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24h

logging:
  level:
    com.jarvis: INFO
