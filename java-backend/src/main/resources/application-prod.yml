spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  address: 127.0.0.1
  port: 8200

jarvis:
  python-service:
    base-url: http://127.0.0.1:8100
  auth:
    cookie-domain: ''
    cookie-secure: true
    same-site: Strict

management:
  server:
    address: 127.0.0.1
    port: 8201
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: jarvis-java
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.hibernate.SQL: WARN
